<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LicitaPro – Sistema de Licitações</title>
<style>
/* ══════════════════════════════════════════
   RESET & TOKENS
══════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --brand:#4f46e5;--brand-dark:#3730a3;--brand-light:#818cf8;
  --violet:#7c3aed;--blue:#2563eb;--cyan:#0891b2;
  --green:#16a34a;--green-light:#dcfce7;
  --red:#dc2626;--red-light:#fee2e2;
  --yellow:#d97706;--yellow-light:#fef3c7;
  --gray-50:#f8fafc;--gray-100:#f1f5f9;--gray-200:#e2e8f0;
  --gray-300:#cbd5e1;--gray-400:#94a3b8;--gray-500:#64748b;
  --gray-600:#475569;--gray-700:#334155;--gray-800:#1e293b;--gray-900:#0f172a;
  --sidebar-w:250px;--topbar-h:64px;
  --radius:12px;--radius-sm:8px;--radius-lg:16px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  --shadow-md:0 4px 12px rgba(0,0,0,.1);
  --shadow-lg:0 16px 40px rgba(0,0,0,.15);
  --transition:.2s ease;
}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--gray-50);
  color:var(--gray-800);display:flex;min-height:100vh;overflow-x:hidden}

/* ══════════════════════════════════════════
   SIDEBAR
══════════════════════════════════════════ */
#sidebar{
  width:var(--sidebar-w);min-height:100vh;position:fixed;left:0;top:0;z-index:100;
  background:linear-gradient(180deg,#1e1b4b 0%,#312e81 40%,#1e3a8a 100%);
  display:flex;flex-direction:column;
  box-shadow:4px 0 24px rgba(0,0,0,.3);
}
.sb-logo{
  padding:24px 20px 20px;display:flex;align-items:center;gap:12px;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.sb-logo-icon{
  width:40px;height:40px;border-radius:10px;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  display:flex;align-items:center;justify-content:center;font-size:1.2rem;
  box-shadow:0 4px 12px rgba(99,102,241,.5);flex-shrink:0;
}
.sb-logo-text{font-size:1.2rem;font-weight:800;color:#fff;letter-spacing:-.02em}
.sb-logo-text span{color:#a5b4fc}
.sb-version{font-size:.65rem;color:rgba(255,255,255,.3);margin-top:1px}
.sb-nav{flex:1;padding:16px 0;overflow-y:auto}
.sb-section{
  font-size:.62rem;font-weight:700;color:rgba(255,255,255,.3);
  text-transform:uppercase;letter-spacing:.1em;
  padding:12px 20px 6px;
}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:11px 20px;
  color:rgba(255,255,255,.65);font-size:.875rem;font-weight:500;
  cursor:pointer;transition:all var(--transition);position:relative;
  border-radius:0;margin:1px 8px;border-radius:10px;
}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.active{background:rgba(99,102,241,.3);color:#fff;
  box-shadow:inset 3px 0 0 #818cf8,0 2px 8px rgba(99,102,241,.2)}
.nav-item .nav-icon{font-size:1rem;width:20px;text-align:center;flex-shrink:0}
.nav-badge{
  margin-left:auto;background:rgba(239,68,68,.9);color:#fff;
  font-size:.62rem;font-weight:700;padding:2px 7px;border-radius:20px;
}
.sb-footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,.08)}
.user-pill{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  background:rgba(255,255,255,.07);border-radius:10px;cursor:pointer;
  transition:background var(--transition);
}
.user-pill:hover{background:rgba(255,255,255,.12)}
.avatar{
  width:32px;height:32px;border-radius:50%;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  display:flex;align-items:center;justify-content:center;
  font-size:.72rem;font-weight:700;color:#fff;flex-shrink:0;
}
.user-name{font-size:.82rem;font-weight:600;color:rgba(255,255,255,.85)}
.user-role{font-size:.68rem;color:rgba(255,255,255,.4)}

/* ══════════════════════════════════════════
   MAIN
══════════════════════════════════════════ */
#main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100vh}
#topbar{
  height:var(--topbar-h);background:#fff;border-bottom:1px solid var(--gray-200);
  display:flex;align-items:center;padding:0 28px;gap:16px;
  position:sticky;top:0;z-index:50;box-shadow:var(--shadow);
}
.topbar-title{font-size:1.05rem;font-weight:700;color:var(--gray-900);flex:1}
.topbar-actions{display:flex;align-items:center;gap:10px}
#content{padding:28px;flex:1}

/* ══════════════════════════════════════════
   BUTTONS
══════════════════════════════════════════ */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 18px;
  border-radius:var(--radius-sm);font-size:.85rem;font-weight:600;
  cursor:pointer;border:none;transition:all var(--transition);white-space:nowrap;
}
.btn-primary{background:linear-gradient(135deg,var(--brand),var(--violet));color:#fff;
  box-shadow:0 4px 12px rgba(79,70,229,.3)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(79,70,229,.45)}
.btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;
  box-shadow:0 4px 12px rgba(220,38,38,.25)}
.btn-danger:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(220,38,38,.35)}
.btn-success{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;
  box-shadow:0 4px 12px rgba(22,163,74,.25)}
.btn-success:hover{transform:translateY(-1px)}
.btn-ghost{background:transparent;color:var(--gray-600);border:1px solid var(--gray-200)}
.btn-ghost:hover{background:var(--gray-50);color:var(--gray-900)}
.btn-sm{padding:6px 12px;font-size:.78rem}
.btn-icon{
  width:32px;height:32px;border-radius:8px;border:none;
  background:transparent;cursor:pointer;color:var(--gray-500);
  display:inline-flex;align-items:center;justify-content:center;font-size:1rem;
  transition:all var(--transition);
}
.btn-icon:hover{background:var(--gray-100);color:var(--gray-900)}
.btn-icon.del:hover{background:var(--red-light);color:var(--red)}

/* ══════════════════════════════════════════
   KPI CARDS
══════════════════════════════════════════ */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.kpi-card{
  border-radius:var(--radius-lg);padding:22px 20px;color:#fff;
  display:flex;align-items:center;gap:16px;
  box-shadow:var(--shadow-md);position:relative;overflow:hidden;
}
.kpi-card::before{
  content:'';position:absolute;right:-20px;top:-20px;
  width:100px;height:100px;border-radius:50%;
  background:rgba(255,255,255,.1);
}
.kpi-card::after{
  content:'';position:absolute;right:20px;bottom:-30px;
  width:60px;height:60px;border-radius:50%;
  background:rgba(255,255,255,.08);
}
.kpi-icon{font-size:2rem;flex-shrink:0;position:relative;z-index:1}
.kpi-body{position:relative;z-index:1}
.kpi-label{font-size:.75rem;font-weight:600;opacity:.8;text-transform:uppercase;letter-spacing:.05em}
.kpi-value{font-size:1.5rem;font-weight:800;line-height:1.2;margin-top:2px}
.kpi-sub{font-size:.72rem;opacity:.65;margin-top:2px}
.kpi-indigo{background:linear-gradient(135deg,#4f46e5,#7c3aed)}
.kpi-green{background:linear-gradient(135deg,#16a34a,#059669)}
.kpi-yellow{background:linear-gradient(135deg,#d97706,#b45309)}
.kpi-red{background:linear-gradient(135deg,#dc2626,#b91c1c)}
.kpi-cyan{background:linear-gradient(135deg,#0891b2,#0e7490)}
.kpi-violet{background:linear-gradient(135deg,#7c3aed,#6d28d9)}

/* ══════════════════════════════════════════
   CARDS / PANELS
══════════════════════════════════════════ */
.card{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow);
  border:1px solid var(--gray-200);overflow:hidden}
.card-header{
  padding:18px 20px;display:flex;align-items:center;gap:10px;
  border-bottom:1px solid var(--gray-100);
}
.card-header h2{font-size:.95rem;font-weight:700;color:var(--gray-900);flex:1;display:flex;align-items:center;gap:8px}
.card-body{padding:20px}
.card-flush{padding:0}

/* ══════════════════════════════════════════
   TABLES
══════════════════════════════════════════ */
.data-table{width:100%;border-collapse:collapse;font-size:.85rem}
.data-table th{
  padding:10px 14px;text-align:left;
  font-size:.7rem;font-weight:700;color:var(--gray-500);
  text-transform:uppercase;letter-spacing:.06em;
  background:var(--gray-50);border-bottom:1px solid var(--gray-200);
}
.data-table td{padding:12px 14px;border-bottom:1px solid var(--gray-100);vertical-align:middle}
.data-table tbody tr:hover{background:var(--gray-50)}
.data-table tbody tr:last-child td{border-bottom:none}
.text-right{text-align:right}
.text-center{text-align:center}

/* ══════════════════════════════════════════
   BADGES
══════════════════════════════════════════ */
.badge{
  display:inline-flex;align-items:center;gap:4px;padding:3px 10px;
  border-radius:20px;font-size:.7rem;font-weight:700;white-space:nowrap;
}
.badge-entregue{background:#dcfce7;color:#15803d}
.badge-parcial{background:#fef9c3;color:#a16207}
.badge-falta{background:#fee2e2;color:#b91c1c}
.badge-pago{background:#dcfce7;color:#15803d}
.badge-pendente{background:#fef9c3;color:#a16207}
.badge-cancelada{background:#f1f5f9;color:#64748b}
.badge-agendado{background:#dbeafe;color:#1d4ed8}
.badge-participando{background:#ede9fe;color:#6d28d9}
.badge-ganho{background:#dcfce7;color:#15803d}
.badge-perdido{background:#fee2e2;color:#b91c1c}
.badge-cancelado{background:#f1f5f9;color:#64748b}

/* ══════════════════════════════════════════
   FORMS
══════════════════════════════════════════ */
.form-control,.form-select{
  width:100%;padding:9px 13px;border:1.5px solid var(--gray-200);
  border-radius:var(--radius-sm);font-size:.88rem;color:var(--gray-800);
  background:#fff;outline:none;transition:border-color var(--transition),box-shadow var(--transition);
}
.form-control:focus,.form-select:focus{
  border-color:var(--brand-light);
  box-shadow:0 0 0 3px rgba(99,102,241,.12);
}
.field-label{font-size:.75rem;font-weight:700;color:var(--gray-500);
  text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:6px}
.req{color:var(--red)}
.fg{display:grid;gap:14px}
.fg-2{grid-template-columns:1fr 1fr}
.fg-3{grid-template-columns:1fr 1fr 1fr}
.fg-4{grid-template-columns:1fr 1fr 1fr 1fr}
.mb14{margin-bottom:14px}
.mb20{margin-bottom:20px}

/* ══════════════════════════════════════════
   MODALS
══════════════════════════════════════════ */
.modal-overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(15,18,41,.65);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;padding:20px;
  opacity:0;pointer-events:none;transition:opacity var(--transition);
}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal-box{
  background:#fff;border-radius:var(--radius-lg);width:100%;max-width:580px;
  box-shadow:var(--shadow-lg);transform:scale(.96) translateY(10px);
  transition:transform var(--transition);max-height:90vh;overflow-y:auto;
}
.modal-overlay.open .modal-box{transform:scale(1) translateY(0)}
.modal-header{
  padding:20px 24px;border-bottom:1px solid var(--gray-100);
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;background:#fff;z-index:1;
}
.modal-header h3{font-size:1rem;font-weight:700;color:var(--gray-900);display:flex;align-items:center;gap:8px}
.modal-body{padding:24px}
.modal-footer{
  padding:16px 24px;border-top:1px solid var(--gray-100);
  display:flex;justify-content:flex-end;gap:10px;
  position:sticky;bottom:0;background:#fff;
}
.modal-lg{max-width:720px}

/* ══════════════════════════════════════════
   SEARCH / FILTERS
══════════════════════════════════════════ */
.search-bar{
  display:flex;align-items:center;gap:8px;
  background:#fff;border:1.5px solid var(--gray-200);border-radius:var(--radius-sm);
  padding:8px 12px;flex:1;min-width:200px;
}
.search-bar input{border:none;outline:none;font-size:.88rem;flex:1;color:var(--gray-800)}
.filter-tabs{display:flex;gap:4px;flex-wrap:wrap}
.filter-tab{
  padding:6px 14px;border-radius:20px;font-size:.78rem;font-weight:600;
  cursor:pointer;color:var(--gray-500);background:transparent;
  border:1.5px solid transparent;transition:all var(--transition);
}
.filter-tab:hover{color:var(--gray-900);border-color:var(--gray-200)}
.filter-tab.active{background:var(--brand);color:#fff;border-color:var(--brand);
  box-shadow:0 2px 8px rgba(79,70,229,.3)}

/* ══════════════════════════════════════════
   EMPTY STATE
══════════════════════════════════════════ */
.empty{text-align:center;padding:52px 20px;color:var(--gray-400)}
.empty-icon{font-size:3rem;margin-bottom:12px}
.empty h3{font-size:.95rem;color:var(--gray-500);margin-bottom:6px}
.empty p{font-size:.82rem}

/* ══════════════════════════════════════════
   CHARTS
══════════════════════════════════════════ */
.chart-wrap{position:relative;padding:20px}
.chart-legend{display:flex;flex-wrap:wrap;gap:12px;padding:0 20px 16px;justify-content:center}
.legend-item{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--gray-600)}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* ══════════════════════════════════════════
   PROFIT INDICATOR
══════════════════════════════════════════ */
.profit-pos{color:var(--green);font-weight:700}
.profit-neg{color:var(--red);font-weight:700}

/* ══════════════════════════════════════════
   MISC
══════════════════════════════════════════ */
.section-title{font-size:1rem;font-weight:700;color:var(--gray-900);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px}
.action-row{display:flex;gap:4px;align-items:center}
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.status-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px}
.tag{
  display:inline-block;padding:2px 8px;border-radius:6px;font-size:.72rem;font-weight:600;
  background:var(--gray-100);color:var(--gray-600);
}
.info-row{display:flex;flex-wrap:wrap;gap:20px;font-size:.82rem;color:var(--gray-600);margin-bottom:12px}
.info-row strong{color:var(--gray-900)}

@media(max-width:768px){
  #sidebar{transform:translateX(-100%);transition:transform .3s}
  #sidebar.open{transform:translateX(0)}
  #main{margin-left:0}
  .kpi-grid{grid-template-columns:1fr 1fr}
  .grid-2,.grid-3{grid-template-columns:1fr}
  .fg-2,.fg-3,.fg-4{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- SIDEBAR -->
<nav id="sidebar">
  <div class="sb-logo">
    <div class="sb-logo-icon">⚖️</div>
    <div>
      <div class="sb-logo-text">Licita<span>Pro</span></div>
      <div class="sb-version">v2.0</div>
    </div>
  </div>
  <div class="sb-nav">
    <div class="sb-section">Principal</div>
    <div class="nav-item active" onclick="nav('dashboard')" data-page="dashboard">
      <span class="nav-icon">📊</span> Dashboard
    </div>
    <div class="sb-section">Operacional</div>
    <div class="nav-item" onclick="nav('empenhos')" data-page="empenhos">
      <span class="nav-icon">📋</span> Empenhos
      <span class="nav-badge" id="nb-empenhos" style="display:none">0</span>
    </div>
    <div class="nav-item" onclick="nav('pregoes')" data-page="pregoes">
      <span class="nav-icon">🏛️</span> Pregões
    </div>
    <div class="sb-section">Financeiro</div>
    <div class="nav-item" onclick="nav('financeiro')" data-page="financeiro">
      <span class="nav-icon">💰</span> Financeiro
    </div>
    <div class="nav-item" onclick="nav('relatorios')" data-page="relatorios">
      <span class="nav-icon">📈</span> Relatórios
    </div>
  </div>
  <div class="sb-footer">
    <div class="user-pill" onclick="logout()">
      <div class="avatar" id="sb-avatar">?</div>
      <div>
        <div class="user-name" id="sb-name">–</div>
        <div class="user-role">Clique para sair</div>
      </div>
    </div>
  </div>
</nav>

<!-- MAIN -->
<div id="main">
  <div id="topbar">
    <div class="topbar-title" id="page-title">Dashboard</div>
    <div class="topbar-actions" id="topbar-actions"></div>
  </div>
  <div id="content"></div>
</div>

<!-- MODALS CONTAINER -->
<div id="modals"></div>

<script>
/* ══════════════════════════════════════════════════════════
   AUTH
══════════════════════════════════════════════════════════ */
const sess = JSON.parse(sessionStorage.getItem('lp_session') || 'null');
if(!sess) location.href = 'login.html';
document.getElementById('sb-avatar').textContent = sess?.initials || '?';
document.getElementById('sb-name').textContent = sess?.name || '–';
function logout(){
  if(confirm('Deseja sair do sistema?')){
    sessionStorage.removeItem('lp_session');
    location.href = 'login.html';
  }
}

/* ══════════════════════════════════════════════════════════
   DB — localStorage CRUD
══════════════════════════════════════════════════════════ */
const DB = {
  _nextId(key){ const d=DB.all(key); return d.length? Math.max(...d.map(x=>x.id))+1:1; },
  all(key){ try{ return JSON.parse(localStorage.getItem('lp_'+key)||'[]'); }catch(e){ return []; } },
  get(key,id){ return DB.all(key).find(x=>x.id==id)||null; },
  save(key,obj){
    const all=DB.all(key);
    if(obj.id){ const i=all.findIndex(x=>x.id==obj.id); if(i>=0)all[i]=obj; else all.push(obj); }
    else{ obj.id=DB._nextId(key); all.push(obj); }
    localStorage.setItem('lp_'+key,JSON.stringify(all));
    syncBroadcast(key);
    return obj;
  },
  del(key,id){
    localStorage.setItem('lp_'+key,JSON.stringify(DB.all(key).filter(x=>x.id!=id)));
    syncBroadcast(key);
  }
};

// Multi-tab sync
let bc;
try{ bc=new BroadcastChannel('licitapro'); bc.onmessage=()=>render(); }catch(e){}
function syncBroadcast(key){ try{ bc?.postMessage({key}); }catch(e){} }

/* ══════════════════════════════════════════════════════════
   FORMATTERS
══════════════════════════════════════════════════════════ */
function brl(v){ return 'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtDate(s){ if(!s)return '–'; const[y,m,d]=s.split('-'); return `${d}/${m}/${y}`; }
function fmtDT(s){ if(!s)return '–'; const [dt,t]=s.split('T'); const[y,m,d]=dt.split('-'); return `${d}/${m}/${y} ${t||''}`; }
function today(){ return new Date().toISOString().slice(0,10); }

/* ══════════════════════════════════════════════════════════
   BUSINESS LOGIC — EMPENHO TOTALS
══════════════════════════════════════════════════════════ */
function empTotals(emp){
  const itens = DB.all('itens').filter(x=>x.empenho_id==emp.id);
  const notas = DB.all('notas').filter(x=>x.empenho_id==emp.id);
  let totalVenda=0,totalCusto=0,qtdEntregue=0,qtdTotal=0;
  itens.forEach(it=>{
    const v=Number(it.valor_venda||0)*Number(it.quantidade||0);
    const c=Number(it.valor_custo||0)*Number(it.quantidade||0);
    totalVenda+=v; totalCusto+=c;
    qtdTotal+=Number(it.quantidade||0);
    if(it.situacao==='ENTREGUE') qtdEntregue+=Number(it.quantidade||0);
    else if(it.situacao==='ENTREGUE PARCIAL') qtdEntregue+=Number(it.quantidade||0)*0.5;
  });
  const lucro=totalVenda-totalCusto;
  const pago=notas.filter(n=>n.situacao==='PAGO').reduce((a,n)=>a+Number(n.valor||0),0);
  const pendente=notas.filter(n=>n.situacao==='PENDENTE').reduce((a,n)=>a+Number(n.valor||0),0);
  let situacao='FALTA ENTREGAR';
  if(itens.length>0){
    if(itens.every(x=>x.situacao==='ENTREGUE')) situacao='ENTREGUE';
    else if(itens.some(x=>x.situacao!=='FALTA ENTREGAR')) situacao='ENTREGUE PARCIAL';
  }
  return {totalVenda,totalCusto,lucro,pago,pendente,situacao,itens,notas,qtdEntregue,qtdTotal};
}

/* ══════════════════════════════════════════════════════════
   NAVIGATION
══════════════════════════════════════════════════════════ */
let _page='dashboard', _params={};
function nav(page,params={}){
  _page=page; _params=params;
  document.querySelectorAll('.nav-item').forEach(el=>{
    el.classList.toggle('active',el.dataset.page===page);
  });
  updateBadges();
  render();
}
function render(){ PAGES[_page]?.(_params); }
function updateBadges(){
  const emps=DB.all('emps');
  const pending=emps.filter(e=>empTotals(e).situacao!=='ENTREGUE').length;
  const nb=document.getElementById('nb-empenhos');
  if(nb){ nb.textContent=pending; nb.style.display=pending>0?'':'none'; }
}

/* ══════════════════════════════════════════════════════════
   CHART UTILITIES — pure canvas, no CDN
══════════════════════════════════════════════════════════ */
const Charts = {
  bar(canvas, labels, datasets, opts={}){
    const ctx=canvas.getContext('2d');
    const W=canvas.width=canvas.offsetWidth*devicePixelRatio||600;
    const H=canvas.height=canvas.offsetHeight*devicePixelRatio||300;
    ctx.scale(devicePixelRatio,devicePixelRatio);
    const cw=canvas.offsetWidth||600,ch=canvas.offsetHeight||200;
    ctx.clearRect(0,0,cw,ch);
    const PAD={top:20,right:20,bottom:50,left:60};
    const pw=cw-PAD.left-PAD.right, ph=ch-PAD.top-PAD.bottom;
    const allVals=datasets.flatMap(d=>d.data);
    const maxV=Math.max(...allVals,1);
    const step=Charts._niceStep(maxV);
    const maxScale=Math.ceil(maxV/step)*step;
    // grid
    ctx.save();
    ctx.translate(PAD.left,PAD.top);
    const numLines=5;
    for(let i=0;i<=numLines;i++){
      const y=ph-ph*(i/numLines);
      ctx.strokeStyle='rgba(0,0,0,.06)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(pw,y);ctx.stroke();
      const val=(maxScale*i/numLines);
      ctx.fillStyle='#94a3b8';ctx.font='10px system-ui';ctx.textAlign='right';
      ctx.fillText(Charts._abbr(val),- 6,y+4);
    }
    // bars
    const bw=pw/(labels.length*datasets.length+labels.length*.5);
    labels.forEach((lbl,li)=>{
      datasets.forEach((ds,di)=>{
        const x=li*(bw*datasets.length+bw*.5)+di*bw;
        const barH=ph*(ds.data[li]/maxScale);
        const y=ph-barH;
        const grad=ctx.createLinearGradient(x,y,x,ph);
        grad.addColorStop(0,ds.color||'#4f46e5');
        grad.addColorStop(1,ds.color2||ds.color||'#7c3aed');
        ctx.fillStyle=grad;
        ctx.beginPath();
        ctx.roundRect?ctx.roundRect(x,y,bw-2,barH,3):ctx.rect(x,y,bw-2,barH);
        ctx.fill();
      });
      ctx.fillStyle='#64748b';ctx.font='10px system-ui';ctx.textAlign='center';
      const cx=li*(bw*datasets.length+bw*.5)+(bw*datasets.length)/2;
      ctx.fillText(lbl.length>6?lbl.slice(0,6)+'…':lbl,cx,ph+16);
    });
    ctx.restore();
  },
  line(canvas, labels, datasets){
    const ctx=canvas.getContext('2d');
    const W=canvas.width=canvas.offsetWidth*devicePixelRatio||600;
    const H=canvas.height=canvas.offsetHeight*devicePixelRatio||300;
    ctx.scale(devicePixelRatio,devicePixelRatio);
    const cw=canvas.offsetWidth||600,ch=canvas.offsetHeight||180;
    ctx.clearRect(0,0,cw,ch);
    const PAD={top:20,right:20,bottom:40,left:60};
    const pw=cw-PAD.left-PAD.right, ph=ch-PAD.top-PAD.bottom;
    const allVals=datasets.flatMap(d=>d.data);
    const maxV=Math.max(...allVals,1);
    ctx.save();ctx.translate(PAD.left,PAD.top);
    for(let i=0;i<=4;i++){
      const y=ph-ph*(i/4);
      ctx.strokeStyle='rgba(0,0,0,.06)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(pw,y);ctx.stroke();
      ctx.fillStyle='#94a3b8';ctx.font='10px system-ui';ctx.textAlign='right';
      ctx.fillText(Charts._abbr(maxV*i/4),-6,y+4);
    }
    datasets.forEach(ds=>{
      if(!ds.data.length)return;
      const pts=ds.data.map((v,i)=>({x:pw*i/(labels.length-1||1),y:ph-ph*(v/maxV)}));
      // area
      const grad=ctx.createLinearGradient(0,0,0,ph);
      grad.addColorStop(0,(ds.color||'#4f46e5')+'33');
      grad.addColorStop(1,(ds.color||'#4f46e5')+'00');
      ctx.beginPath();ctx.moveTo(pts[0].x,ph);
      pts.forEach(p=>ctx.lineTo(p.x,p.y));
      ctx.lineTo(pts[pts.length-1].x,ph);ctx.closePath();
      ctx.fillStyle=grad;ctx.fill();
      // line
      ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
      pts.forEach(p=>ctx.lineTo(p.x,p.y));
      ctx.strokeStyle=ds.color||'#4f46e5';ctx.lineWidth=2.5;
      ctx.lineJoin='round';ctx.stroke();
      // dots
      pts.forEach(p=>{
        ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);
        ctx.fillStyle='#fff';ctx.fill();
        ctx.strokeStyle=ds.color||'#4f46e5';ctx.lineWidth=2;ctx.stroke();
      });
    });
    labels.forEach((lbl,i)=>{
      const x=pw*i/(labels.length-1||1);
      ctx.fillStyle='#64748b';ctx.font='10px system-ui';ctx.textAlign='center';
      ctx.fillText(lbl.length>5?lbl.slice(0,5)+'…':lbl,x,ph+16);
    });
    ctx.restore();
  },
  donut(svg, segments){
    // segments = [{label,value,color}]
    const total=segments.reduce((a,s)=>a+s.value,0)||1;
    const R=60,cx=80,cy=80,stroke=22;
    const circ=2*Math.PI*R;
    let offset=0;
    let arcs='';
    segments.forEach(s=>{
      const dash=circ*(s.value/total);
      arcs+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${s.color}" stroke-width="${stroke}"
        stroke-dasharray="${dash} ${circ-dash}"
        stroke-dashoffset="${-offset}"
        transform="rotate(-90 ${cx} ${cy})"
        style="transition:stroke-dasharray .4s"/>`;
      offset+=dash;
    });
    svg.innerHTML=`<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%">
      <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#f1f5f9" stroke-width="${stroke}"/>
      ${arcs}
    </svg>`;
  },
  _niceStep(max){ const e=Math.pow(10,Math.floor(Math.log10(max))); return e*(max/e>5?5:max/e>2?2:1); },
  _abbr(v){ if(v>=1e6)return (v/1e6).toFixed(1)+'M'; if(v>=1e3)return (v/1e3).toFixed(0)+'k'; return v.toFixed(0); }
};

/* ══════════════════════════════════════════════════════════
   PAGE: DASHBOARD
══════════════════════════════════════════════════════════ */
function pageDashboard(){
  setTitle('Dashboard');
  const emps=DB.all('emps');
  const prgs=DB.all('prgs');
  const saidas=DB.all('saidas');
  const notas=DB.all('notas');
  let recebido=0,pendente=0,totalSaidas=0,lucroTotal=0;
  emps.forEach(e=>{
    const t=empTotals(e);
    recebido+=t.pago; pendente+=t.pendente; lucroTotal+=t.lucro;
  });
  notas.forEach(n=>{ if(n.situacao==='PAGO') recebido=recebido; }); // already counted
  saidas.forEach(s=>totalSaidas+=Number(s.valor||0));
  const saldo=recebido-totalSaidas;
  const ganhos=prgs.filter(p=>p.status==='GANHO').length;
  const total=prgs.length||1;

  // Recent empenhos
  const recentEmps=emps.slice(-5).reverse();
  const recentPregs=prgs.slice(-5).reverse();

  // Monthly data for chart
  const months={};
  const now=new Date();
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    months[key]={label:`${['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'][d.getMonth()]}/${String(d.getFullYear()).slice(2)}`,receita:0,saida:0};
  }
  notas.forEach(n=>{
    if(n.situacao==='PAGO'&&n.data){
      const k=n.data.slice(0,7);
      if(months[k]) months[k].receita+=Number(n.valor||0);
    }
  });
  saidas.forEach(s=>{
    if(s.data){
      const k=s.data.slice(0,7);
      if(months[k]) months[k].saida+=Number(s.valor||0);
    }
  });
  const mkeys=Object.keys(months);
  const chartLabels=mkeys.map(k=>months[k].label);
  const chartReceita=mkeys.map(k=>months[k].receita);
  const chartSaidas=mkeys.map(k=>months[k].saida);

  setActions('');
  setModals('');
  setContent(`
  <div class="kpi-grid">
    <div class="kpi-card kpi-indigo">
      <div class="kpi-icon">💰</div>
      <div class="kpi-body">
        <div class="kpi-label">Receita Recebida</div>
        <div class="kpi-value">${brl(recebido)}</div>
        <div class="kpi-sub">notas fiscais pagas</div>
      </div>
    </div>
    <div class="kpi-card kpi-yellow">
      <div class="kpi-icon">⏳</div>
      <div class="kpi-body">
        <div class="kpi-label">A Receber</div>
        <div class="kpi-value">${brl(pendente)}</div>
        <div class="kpi-sub">notas pendentes</div>
      </div>
    </div>
    <div class="kpi-card kpi-green">
      <div class="kpi-icon">📈</div>
      <div class="kpi-body">
        <div class="kpi-label">Lucro Total</div>
        <div class="kpi-value">${brl(lucroTotal)}</div>
        <div class="kpi-sub">venda − custo</div>
      </div>
    </div>
    <div class="kpi-card kpi-${saldo>=0?'cyan':'red'}">
      <div class="kpi-icon">🏦</div>
      <div class="kpi-body">
        <div class="kpi-label">Saldo</div>
        <div class="kpi-value">${brl(saldo)}</div>
        <div class="kpi-sub">recebido − saídas (${brl(totalSaidas)})</div>
      </div>
    </div>
    <div class="kpi-card kpi-violet">
      <div class="kpi-icon">📋</div>
      <div class="kpi-body">
        <div class="kpi-label">Empenhos</div>
        <div class="kpi-value">${emps.length}</div>
        <div class="kpi-sub">${emps.filter(e=>empTotals(e).situacao==='ENTREGUE').length} entregues</div>
      </div>
    </div>
    <div class="kpi-card kpi-${ganhos/total>=.5?'green':'yellow'}">
      <div class="kpi-icon">🏆</div>
      <div class="kpi-body">
        <div class="kpi-label">Taxa de Ganho</div>
        <div class="kpi-value">${prgs.length?Math.round(ganhos/total*100):0}%</div>
        <div class="kpi-sub">${ganhos} de ${prgs.length} pregões</div>
      </div>
    </div>
  </div>

  <div class="grid-2" style="margin-bottom:20px">
    <div class="card">
      <div class="card-header">
        <h2>📊 Receita vs Saídas (6 meses)</h2>
      </div>
      <div style="padding:16px;height:220px">
        <canvas id="barChart" style="width:100%;height:100%"></canvas>
      </div>
      <div class="chart-legend">
        <span class="legend-item"><span class="legend-dot" style="background:#4f46e5"></span>Receita</span>
        <span class="legend-item"><span class="legend-dot" style="background:#ef4444"></span>Saídas</span>
      </div>
    </div>
    <div class="card">
      <div class="card-header">
        <h2>🍩 Status Empenhos</h2>
      </div>
      <div style="display:flex;align-items:center;gap:20px;padding:16px">
        <div id="donutEmp" style="width:160px;height:160px;flex-shrink:0"></div>
        <div id="donutLegend" style="font-size:.8rem;display:flex;flex-direction:column;gap:8px"></div>
      </div>
    </div>
  </div>

  <div class="grid-2">
    <div class="card">
      <div class="card-header">
        <h2>📋 Empenhos Recentes</h2>
        <button class="btn btn-ghost btn-sm" onclick="nav('empenhos')">Ver todos</button>
      </div>
      <div class="card-flush">
        ${recentEmps.length?`<table class="data-table">
          <thead><tr><th>Número</th><th>Órgão</th><th>Valor</th><th>Status</th></tr></thead>
          <tbody>${recentEmps.map(e=>{const t=empTotals(e);return`<tr>
            <td><span style="font-weight:700;color:var(--brand)">#${e.numero}</span></td>
            <td style="font-size:.82rem">${e.orgao||'–'}</td>
            <td style="font-weight:700">${brl(t.totalVenda)}</td>
            <td>${situacaoBadge(t.situacao)}</td>
          </tr>`}).join('')}</tbody>
        </table>`:`<div class="empty"><div class="empty-icon">📋</div><h3>Nenhum empenho</h3></div>`}
      </div>
    </div>
    <div class="card">
      <div class="card-header">
        <h2>🏛️ Pregões Recentes</h2>
        <button class="btn btn-ghost btn-sm" onclick="nav('pregoes')">Ver todos</button>
      </div>
      <div class="card-flush">
        ${recentPregs.length?`<table class="data-table">
          <thead><tr><th>Órgão</th><th>Valor</th><th>Status</th></tr></thead>
          <tbody>${recentPregs.map(p=>`<tr>
            <td style="font-weight:600;font-size:.82rem">${p.orgao||'–'}</td>
            <td style="font-weight:700">${p.valor?brl(p.valor):'–'}</td>
            <td>${pregaoBadge(p.status)}</td>
          </tr>`).join('')}</tbody>
        </table>`:`<div class="empty"><div class="empty-icon">🏛️</div><h3>Nenhum pregão</h3></div>`}
      </div>
    </div>
  </div>
  `);

  // render charts after DOM
  requestAnimationFrame(()=>{
    const bc=document.getElementById('barChart');
    if(bc) Charts.bar(bc,chartLabels,[
      {data:chartReceita,color:'#4f46e5',color2:'#7c3aed'},
      {data:chartSaidas,color:'#ef4444',color2:'#dc2626'},
    ]);
    // donut
    const seg=[
      {label:'Entregue',   value:emps.filter(e=>empTotals(e).situacao==='ENTREGUE').length,       color:'#16a34a'},
      {label:'Parc.',      value:emps.filter(e=>empTotals(e).situacao==='ENTREGUE PARCIAL').length,color:'#d97706'},
      {label:'Falta',      value:emps.filter(e=>empTotals(e).situacao==='FALTA ENTREGAR').length,  color:'#dc2626'},
    ].filter(s=>s.value>0);
    if(!seg.length) seg.push({label:'Sem dados',value:1,color:'#e2e8f0'});
    const de=document.getElementById('donutEmp');
    if(de) Charts.donut(de,seg);
    const dl=document.getElementById('donutLegend');
    if(dl) dl.innerHTML=seg.map(s=>`<span class="legend-item"><span class="legend-dot" style="background:${s.color}"></span>${s.label}: <strong>${s.value}</strong></span>`).join('');
  });
}

let _empSearch='', _empStatus='';
function pageEmpenhos(){
  setTitle('Empenhos');
  setActions(`<button class="btn btn-primary btn-sm" onclick="openModal('modalEmp')">＋ Novo Empenho</button>`);
  let emps=DB.all('emps');
  if(_empSearch) emps=emps.filter(e=>(e.numero+e.orgao+e.objeto+'').toLowerCase().includes(_empSearch.toLowerCase()));
  if(_empStatus) emps=emps.filter(e=>empTotals(e).situacao===_empStatus);
  emps=emps.reverse();

  const statusList=['','FALTA ENTREGAR','ENTREGUE PARCIAL','ENTREGUE'];
  setContent(`
  <div class="toolbar">
    <label class="search-bar">
      <span>🔍</span>
      <input type="text" placeholder="Buscar nº, órgão, objeto…" value="${_empSearch}"
        oninput="_empSearch=this.value;pageEmpenhos()">
    </label>
    <div class="filter-tabs">
      ${statusList.map(s=>`<span class="filter-tab ${_empStatus===s?'active':''}"
        onclick="_empStatus='${s}';pageEmpenhos()">${s||'Todos'}</span>`).join('')}
    </div>
  </div>
  <div class="card">
    <div class="card-flush">
      ${emps.length?`<div style="overflow-x:auto"><table class="data-table">
        <thead><tr>
          <th>Nº Empenho</th><th>Órgão</th><th>Objeto</th>
          <th class="text-right">Venda</th><th class="text-right">Custo</th>
          <th class="text-right">Lucro</th><th>Entrega</th><th>NFs</th><th></th>
        </tr></thead>
        <tbody>${emps.map(e=>{
          const t=empTotals(e);
          const lucroClass=t.lucro<0?'profit-neg':'profit-pos';
          return`<tr>
            <td><span style="font-weight:800;color:var(--brand);cursor:pointer" onclick="nav('empDetalhe',{id:${e.id}})">#${e.numero}</span></td>
            <td style="font-weight:600;max-width:160px;font-size:.83rem">${e.orgao||'–'}</td>
            <td style="font-size:.78rem;color:var(--gray-500);max-width:180px">${(e.objeto||'').slice(0,60)||'–'}</td>
            <td class="text-right" style="font-weight:700">${brl(t.totalVenda)}</td>
            <td class="text-right" style="color:var(--gray-500)">${brl(t.totalCusto)}</td>
            <td class="text-right"><span class="${lucroClass}">${brl(t.lucro)}</span></td>
            <td>${situacaoBadge(t.situacao)}</td>
            <td>
              <span style="font-size:.78rem;color:var(--gray-500)">${t.notas.length} NF</span>
              ${t.pendente>0?`<span class="badge badge-pendente" style="margin-left:4px">${brl(t.pendente)}</span>`:''}
            </td>
            <td><div class="action-row">
              <button class="btn-icon" onclick="nav('empDetalhe',{id:${e.id}})" title="Detalhes">📄</button>
              <button class="btn-icon" onclick="editEmp(${e.id})" title="Editar">✏️</button>
              <button class="btn-icon del" onclick="delEmp(${e.id})" title="Excluir">🗑️</button>
            </div></td>
          </tr>`;
        }).join('')}</tbody>
        <tfoot><tr>
          <td colspan="3" style="font-weight:700;color:var(--gray-500);font-size:.8rem;padding:12px 14px">
            Total (${emps.length} empenhos)
          </td>
          <td class="text-right" style="font-weight:800">${brl(emps.reduce((a,e)=>a+empTotals(e).totalVenda,0))}</td>
          <td class="text-right" style="color:var(--gray-500)">${brl(emps.reduce((a,e)=>a+empTotals(e).totalCusto,0))}</td>
          <td class="text-right"><span class="${emps.reduce((a,e)=>a+empTotals(e).lucro,0)>=0?'profit-pos':'profit-neg'}">${brl(emps.reduce((a,e)=>a+empTotals(e).lucro,0))}</span></td>
          <td colspan="3"></td>
        </tr></tfoot>
      </table></div>`:`<div class="empty"><div class="empty-icon">📋</div><h3>Nenhum empenho encontrado</h3><p>Cadastre o primeiro empenho da empresa</p></div>`}
    </div>
  </div>
  `);
  renderModalEmp();
}

function renderModalEmp(emp=null){
  setModals(`
  <div class="modal-overlay" id="modalEmp">
    <div class="modal-box">
      <div class="modal-header">
        <h3>📋 ${emp?'Editar':'Novo'} Empenho</h3>
        <button class="btn-icon" onclick="closeModal('modalEmp')">✕</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="empId" value="${emp?.id||''}">
        <div class="fg fg-2 mb14">
          <div>
            <label class="field-label">Nº Empenho <span class="req">*</span></label>
            <input type="text" id="empNumero" class="form-control" value="${emp?.numero||''}" placeholder="Ex: 2024NE001234">
          </div>
          <div>
            <label class="field-label">Data</label>
            <input type="date" id="empData" class="form-control" value="${emp?.data||today()}">
          </div>
        </div>
        <div class="mb14">
          <label class="field-label">Órgão <span class="req">*</span></label>
          <input type="text" id="empOrgao" class="form-control" value="${emp?.orgao||''}" placeholder="Ex: Tribunal de Contas">
        </div>
        <div class="mb14">
          <label class="field-label">UASG</label>
          <input type="text" id="empUasg" class="form-control" value="${emp?.uasg||''}" placeholder="Ex: 929458">
        </div>
        <div class="mb14">
          <label class="field-label">Objeto</label>
          <textarea id="empObjeto" class="form-control" rows="2" placeholder="Descrição do objeto">${emp?.objeto||''}</textarea>
        </div>
        <div>
          <label class="field-label">Observação</label>
          <textarea id="empObs" class="form-control" rows="2">${emp?.observacao||''}</textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal('modalEmp')">Cancelar</button>
        <button class="btn btn-primary" onclick="saveEmp()">✓ Salvar Empenho</button>
      </div>
    </div>
  </div>
  `);
  if(emp) openModal('modalEmp');
}

function saveEmp(){
  const id=document.getElementById('empId').value;
  const numero=document.getElementById('empNumero').value.trim();
  const orgao=document.getElementById('empOrgao').value.trim();
  if(!numero||!orgao){ alert('Preencha nº empenho e órgão.'); return; }
  DB.save('emps',{
    id:id?Number(id):null, numero, orgao,
    data:document.getElementById('empData').value,
    uasg:document.getElementById('empUasg').value,
    objeto:document.getElementById('empObjeto').value,
    observacao:document.getElementById('empObs').value,
  });
  closeModal('modalEmp');
  updateBadges();
  pageEmpenhos();
}

function editEmp(id){
  const emp=DB.get('emps',id);
  if(!emp)return;
  renderModalEmp(emp);
}

function delEmp(id){
  if(!confirm('Excluir empenho e todos seus itens/NFs?'))return;
  DB.all('itens').filter(x=>x.empenho_id==id).forEach(x=>DB.del('itens',x.id));
  DB.all('notas').filter(x=>x.empenho_id==id).forEach(x=>DB.del('notas',x.id));
  DB.del('emps',id);
  updateBadges();
  pageEmpenhos();
}

function calcItem(){
  const qtd=Number(document.getElementById('itemQtd')?.value||0);
  const venda=Number(document.getElementById('itemVenda')?.value||0);
  const custo=Number(document.getElementById('itemCusto')?.value||0);
  const tv=qtd*venda, tc=qtd*custo, lc=tv-tc;
  const el=id=>document.getElementById(id);
  if(el('calc-tv')) el('calc-tv').textContent=brl(tv);
  if(el('calc-tc')){ el('calc-tc').textContent=brl(tc); el('calc-tc').style.color=tc>tv?'var(--red)':'var(--gray-700)'; }
  if(el('calc-lc')){ el('calc-lc').textContent=brl(lc); el('calc-lc').style.color=lc>=0?'var(--green)':'var(--red)'; }
}

function saveItem(){
  const id=document.getElementById('itemId').value;
  const empId=document.getElementById('itemEmpId').value;
  const nome=document.getElementById('itemNome').value.trim();
  const qtd=document.getElementById('itemQtd').value;
  const venda=document.getElementById('itemVenda').value;
  if(!nome||!qtd||!venda){ alert('Preencha nome, quantidade e valor de venda.'); return; }
  DB.save('itens',{
    id:id?Number(id):null,empenho_id:Number(empId),
    item_nome:nome,unidade:document.getElementById('itemUn').value,
    quantidade:Number(qtd),valor_venda:Number(venda),
    valor_custo:Number(document.getElementById('itemCusto').value||0),
    situacao:document.getElementById('itemSit').value,
    observacao:document.getElementById('itemObs').value,
  });
  closeModal('modalItem');
  updateBadges();
  pageEmpDetalhe({id:Number(empId)});
}

function editItem(itemId,empId){
  const it=DB.get('itens',itemId);
  if(!it)return;
  document.getElementById('itemId').value=it.id;
  document.getElementById('itemNome').value=it.item_nome||'';
  document.getElementById('itemUn').value=it.unidade||'';
  document.getElementById('itemQtd').value=it.quantidade||'';
  document.getElementById('itemVenda').value=it.valor_venda||'';
  document.getElementById('itemCusto').value=it.valor_custo||'';
  document.getElementById('itemSit').value=it.situacao||'FALTA ENTREGAR';
  document.getElementById('itemObs').value=it.observacao||'';
  calcItem();
  openModal('modalItem');
}

function delItem(itemId,empId){
  if(!confirm('Excluir este item?'))return;
  DB.del('itens',itemId);
  pageEmpDetalhe({id:Number(empId)});
}

function updateItemSituacao(itemId,val,empId){
  const it=DB.get('itens',itemId);
  if(!it)return;
  it.situacao=val;
  DB.save('itens',it);
  updateBadges();
  // re-render only KPIs section to avoid UI jump
  pageEmpDetalhe({id:Number(empId)});
}

function saveNF(){
  const id=document.getElementById('nfId').value;
  const empId=document.getElementById('nfEmpId').value;
  const valor=document.getElementById('nfValor').value;
  if(!valor){ alert('Preencha o valor da NF.'); return; }
  const sit=document.querySelector('input[name="nfSit"]:checked')?.value||'PENDENTE';
  DB.save('notas',{
    id:id?Number(id):null,empenho_id:Number(empId),
    numero:document.getElementById('nfNumero').value,
    data:document.getElementById('nfData').value,
    valor:Number(valor),situacao:sit,
    observacao:document.getElementById('nfObs').value,
  });
  closeModal('modalNF');
  pageEmpDetalhe({id:Number(empId)});
}

function delNF(nfId,empId){
  if(!confirm('Excluir esta NF?'))return;
  DB.del('notas',nfId);
  pageEmpDetalhe({id:Number(empId)});
}

function updateNFSituacao(nfId,val,empId){
  const nf=DB.get('notas',nfId);
  if(!nf)return;
  nf.situacao=val;
  DB.save('notas',nf);
  pageEmpDetalhe({id:Number(empId)});
}

let _finMes='';
function pageFinanceiro(){
  if(!_finMes){ const n=new Date(); _finMes=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`; }

  setActions(`<button class="btn btn-danger btn-sm" onclick="openModal('modalSaida')">＋ Nova Saída</button>`);

  const notas=DB.all('notas');
  const saidas=DB.all('saidas');

  const notasMes=notas.filter(n=>n.data&&n.data.startsWith(_finMes));
  const saidasMes=saidas.filter(s=>s.data&&s.data.startsWith(_finMes));
  const totalRecebido=notasMes.filter(n=>n.situacao==='PAGO').reduce((a,n)=>a+Number(n.valor||0),0);
  const totalPendente=notasMes.filter(n=>n.situacao==='PENDENTE').reduce((a,n)=>a+Number(n.valor||0),0);
  const totalSaidas=saidasMes.reduce((a,s)=>a+Number(s.valor||0),0);
  const saldo=totalRecebido-totalSaidas;

  // Line chart data — last 6 months
  const months={};
  for(let i=5;i>=0;i--){
    const [y,m]=_finMes.split('-').map(Number);
    const d=new Date(y,m-1-i,1);

    const lbl=`${['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'][d.getMonth()]}`;
    months[key]={label:lbl,rec:0,sai:0};
  }
  notas.forEach(n=>{ if(n.situacao==='PAGO'&&n.data){ const k=n.data.slice(0,7); if(months[k])months[k].rec+=Number(n.valor||0); }});
  saidas.forEach(s=>{ if(s.data){ const k=s.data.slice(0,7); if(months[k])months[k].sai+=Number(s.valor||0); }});

  setContent(`

    <div class="kpi-card kpi-yellow">
      <div class="kpi-icon">⏳</div>
      <div class="kpi-body"><div class="kpi-label">A Receber</div><div class="kpi-value">${brl(totalPendente)}</div></div>
    </div>
    <div class="kpi-card kpi-red">
      <div class="kpi-icon">⬇️</div>
      <div class="kpi-body"><div class="kpi-label">Saídas no Mês</div><div class="kpi-value">${brl(totalSaidas)}</div></div>
    </div>
    <div class="kpi-card kpi-${saldo>=0?'indigo':'red'}">
      <div class="kpi-icon">🏦</div>
      <div class="kpi-body">
        <div class="kpi-label">Saldo do Mês</div>
        <div class="kpi-value">${brl(saldo)}</div>
        <div class="kpi-sub">recebido − saídas</div>
      </div>
    </div>
  </div>

  <div class="card" style="margin-bottom:20px">

    <div style="padding:16px;height:200px">
      <canvas id="lineChart" style="width:100%;height:100%"></canvas>

    <div class="card-flush">
      ${saidas.length?`<div style="overflow-x:auto"><table class="data-table">

/* ══════════════════════════════════════════════════════════
   DATA EXPORT / IMPORT
══════════════════════════════════════════════════════════ */
function exportData(){
  const data={
    emps:DB.all('emps'),itens:DB.all('itens'),
    notas:DB.all('notas'),prgs:DB.all('prgs'),saidas:DB.all('saidas'),
    exportedAt:new Date().toISOString(),version:'2.0'
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`licitapro-backup-${today()}.json`;
  a.click();
}

function importData(input){
  const file=input.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(!confirm(`Importar ${d.emps?.length||0} empenhos, ${d.prgs?.length||0} pregões? Os dados atuais serão SUBSTITUÍDOS.`))return;
      if(d.emps) localStorage.setItem('lp_emps',JSON.stringify(d.emps));
      if(d.itens) localStorage.setItem('lp_itens',JSON.stringify(d.itens));
      if(d.notas) localStorage.setItem('lp_notas',JSON.stringify(d.notas));
      if(d.prgs) localStorage.setItem('lp_prgs',JSON.stringify(d.prgs));
      if(d.saidas) localStorage.setItem('lp_saidas',JSON.stringify(d.saidas));
      alert('Dados importados com sucesso!');
      render();
    }catch(err){ alert('Erro ao importar: '+err.message); }
  };
  reader.readAsText(file);
}

function clearData(){
  if(!confirm('ATENÇÃO: Todos os dados serão permanentemente excluídos. Tem certeza?'))return;
  if(!confirm('Última confirmação: Excluir TODOS os dados?'))return;
  ['emps','itens','notas','prgs','saidas'].forEach(k=>localStorage.removeItem('lp_'+k));
  render();
}

/* ══════════════════════════════════════════════════════════
   BADGE HELPERS
══════════════════════════════════════════════════════════ */
function situacaoBadge(s){
  const map={
    'ENTREGUE':'badge-entregue',
    'ENTREGUE PARCIAL':'badge-parcial',
    'FALTA ENTREGAR':'badge-falta',
  };
  const icons={'ENTREGUE':'✅','ENTREGUE PARCIAL':'⚠️','FALTA ENTREGAR':'❌'};
  return `<span class="badge ${map[s]||'badge-falta'}">${icons[s]||''} ${s||'–'}</span>`;
}
function pregaoBadge(s){
  const map={GANHO:'badge-ganho',PERDIDO:'badge-perdido',AGENDADO:'badge-agendado',PARTICIPANDO:'badge-participando',CANCELADO:'badge-cancelado'};
  const icons={GANHO:'🏆',PERDIDO:'✗',AGENDADO:'🕐',PARTICIPANDO:'▶',CANCELADO:'⊘'};
  return `<span class="badge ${map[s]||'badge-agendado'}">${icons[s]||''} ${s||'–'}</span>`;
}
function nfBadge(s){
  const map={PAGO:'badge-pago',PENDENTE:'badge-pendente',CANCELADA:'badge-cancelada'};
  return `<span class="badge ${map[s]||'badge-pendente'}">${s||'–'}</span>`;
}
