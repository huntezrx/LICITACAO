<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LicitaPro – Login</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --brand:#4f46e5;--brand2:#7c3aed;--brand3:#2563eb;
  --radius:16px;--speed:.3s;
}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:#0f0c29;overflow:hidden;position:relative;
}
.bg-anim{
  position:fixed;inset:0;z-index:0;
  background:linear-gradient(135deg,#0f0c29 0%,#302b63 50%,#24243e 100%);
}
.orb{
  position:absolute;border-radius:50%;filter:blur(80px);opacity:.5;
  animation:float 8s ease-in-out infinite;
}
.orb1{width:420px;height:420px;background:#4f46e5;top:-100px;left:-100px;animation-delay:0s}
.orb2{width:360px;height:360px;background:#7c3aed;bottom:-80px;right:-80px;animation-delay:-3s}
.orb3{width:250px;height:250px;background:#2563eb;top:50%;left:60%;animation-delay:-5s}
@keyframes float{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(30px,-40px) scale(1.05)}
  66%{transform:translate(-20px,20px) scale(.97)}
}
.particles{position:fixed;inset:0;z-index:1;pointer-events:none}
.card{
  position:relative;z-index:10;
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid rgba(255,255,255,.15);
  border-radius:24px;padding:48px 40px;width:420px;max-width:95vw;
  box-shadow:0 32px 64px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.05) inset;
  animation:slideUp .6s cubic-bezier(.22,1,.36,1) both;
}
@keyframes slideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
.logo{
  display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:36px;
}
.logo-icon{
  width:52px;height:52px;border-radius:14px;
  background:linear-gradient(135deg,#4f46e5,#7c3aed);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 24px rgba(79,70,229,.5);
  font-size:1.5rem;
}
.logo-text{font-size:1.6rem;font-weight:800;color:#fff;letter-spacing:-.02em}
.logo-text span{color:#818cf8}
.subtitle{text-align:center;color:rgba(255,255,255,.5);font-size:.85rem;margin-bottom:32px;letter-spacing:.01em}
.field{margin-bottom:20px;position:relative}
.field label{display:block;font-size:.78rem;font-weight:700;color:rgba(255,255,255,.6);
  text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.field .icon{
  position:absolute;left:14px;bottom:14px;color:rgba(255,255,255,.4);font-size:1.1rem;
  pointer-events:none;
}
.field input{
  width:100%;padding:13px 14px 13px 42px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
  border-radius:12px;color:#fff;font-size:.95rem;outline:none;
  transition:border-color var(--speed),background var(--speed),box-shadow var(--speed);
}
.field input::placeholder{color:rgba(255,255,255,.3)}
.field input:focus{
  border-color:rgba(99,102,241,.7);background:rgba(255,255,255,.11);
  box-shadow:0 0 0 3px rgba(99,102,241,.2);
}
.toggle-pw{
  position:absolute;right:14px;bottom:14px;
  background:none;border:none;color:rgba(255,255,255,.4);
  cursor:pointer;font-size:1rem;padding:0;line-height:1;
  transition:color var(--speed);
}
.toggle-pw:hover{color:rgba(255,255,255,.8)}
.btn-login{
  width:100%;padding:15px;border:none;border-radius:12px;
  background:linear-gradient(135deg,#4f46e5,#7c3aed);
  color:#fff;font-size:1rem;font-weight:700;cursor:pointer;
  letter-spacing:.02em;position:relative;overflow:hidden;
  box-shadow:0 8px 24px rgba(79,70,229,.45);
  transition:transform var(--speed),box-shadow var(--speed);
  margin-top:8px;
}
.btn-login::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.15),transparent);
  opacity:0;transition:opacity var(--speed);
}
.btn-login:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(79,70,229,.6)}
.btn-login:hover::after{opacity:1}
.btn-login:active{transform:translateY(0)}
.error{
  color:#f87171;font-size:.8rem;margin-top:16px;text-align:center;
  padding:10px 14px;background:rgba(248,113,113,.1);border-radius:8px;
  border:1px solid rgba(248,113,113,.2);display:none;
}
.divider{
  text-align:center;color:rgba(255,255,255,.25);font-size:.75rem;
  margin:24px 0 16px;display:flex;align-items:center;gap:10px;
}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.1)}
.hints{font-size:.73rem;color:rgba(255,255,255,.35);text-align:center;line-height:1.8}
.hints code{background:rgba(255,255,255,.08);padding:1px 6px;border-radius:4px;color:rgba(255,255,255,.55)}
.footer{text-align:center;margin-top:28px;color:rgba(255,255,255,.2);font-size:.73rem}
</style>
</head>
<body>
<div class="bg-anim">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
</div>
<canvas class="particles" id="pCanvas"></canvas>

<div class="card">
  <div class="logo">
    <div class="logo-icon">⚖️</div>
    <div class="logo-text">Licita<span>Pro</span></div>
  </div>
  <div class="subtitle">Sistema de Gestão de Licitações</div>

  <div class="field">
    <label>Usuário</label>
    <span class="icon">👤</span>
    <input type="text" id="usr" placeholder="Digite seu usuário" autocomplete="username">
  </div>
  <div class="field">
    <label>Senha</label>
    <span class="icon">🔒</span>
    <input type="password" id="pwd" placeholder="Digite sua senha" autocomplete="current-password" id="pwd">
    <button class="toggle-pw" id="eyeBtn" onclick="togglePw()">👁️</button>
  </div>

  <button class="btn-login" onclick="doLogin()">Entrar no Sistema</button>
  <div class="error" id="errMsg">Usuário ou senha incorretos. Tente novamente.</div>

  <div class="divider">Credenciais de Acesso</div>
  <div class="hints">
    <code>victor</code> / <code>admin123</code> &nbsp;|&nbsp;
    <code>admin</code> / <code>1234</code> &nbsp;|&nbsp;
    <code>karol</code> / <code>karol123</code>
  </div>
  <div class="footer">LicitaPro v2.0 &copy; 2025</div>
</div>

<script>
const USERS = [
  {id:1,username:'admin',  password:'1234',      name:'Administrador', initials:'AD',role:'admin'},
  {id:2,username:'victor', password:'admin123',  name:'Victor',        initials:'VI',role:'manager'},
  {id:3,username:'karol',  password:'karol123',  name:'Karol',         initials:'KA',role:'user'},
];

function doLogin(){
  const u=document.getElementById('usr').value.trim();
  const p=document.getElementById('pwd').value;
  const found=USERS.find(x=>x.username===u && x.password===p);
  const err=document.getElementById('errMsg');
  if(found){
    err.style.display='none';
    sessionStorage.setItem('lp_session',JSON.stringify({id:found.id,name:found.name,initials:found.initials,role:found.role}));
    document.querySelector('.btn-login').textContent='✓ Redirecionando...';
    setTimeout(()=>location.href='index.html',400);
  } else {
    err.style.display='block';
    document.getElementById('pwd').value='';
    document.getElementById('pwd').focus();
  }
}

function togglePw(){
  const p=document.getElementById('pwd');
  const b=document.getElementById('eyeBtn');
  if(p.type==='password'){p.type='text';b.textContent='🙈'}
  else{p.type='password';b.textContent='👁️'}
}

document.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
if(sessionStorage.getItem('lp_session'))location.href='index.html';

// Particles
(function(){
  const c=document.getElementById('pCanvas');
  const ctx=c.getContext('2d');
  let W,H,pts=[];
  function resize(){W=c.width=innerWidth;H=c.height=innerHeight}
  function init(){
    pts=[];
    for(let i=0;i<60;i++)pts.push({
      x:Math.random()*W,y:Math.random()*H,
      vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,
      r:Math.random()*2+.5,
      a:Math.random()
    });
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    pts.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0)p.x=W;if(p.x>W)p.x=0;
      if(p.y<0)p.y=H;if(p.y>H)p.y=0;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(129,140,248,${p.a*.4})`;ctx.fill();
    });
    // connections
    for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){
      const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<120){
        ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);
        ctx.strokeStyle=`rgba(129,140,248,${(1-d/120)*.15})`;ctx.lineWidth=.5;ctx.stroke();
      }
    }
    requestAnimationFrame(draw);
  }
  resize();init();draw();
  window.addEventListener('resize',()=>{resize();init()});
})();
</script>
</body>
</html>
